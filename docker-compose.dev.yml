services:
  # --- THE FRONTEND (Vite with Hot-Reloading) ---
  frontend:
    build: ./frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      # Map your code so live-reloading works
      - ./frontend:/app
      # Prevents local empty node_modules from overwriting container
      - /app/node_modules
      # Maps the custom remark plugin
      - ./remark-internal-links:/remark-internal-links
    environment:
      # Tell React where the backend is so it can make API calls!
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend

  # --- THE BACKEND (Flask API) ---
  backend:
    build: ./backend
    working_dir: /backend
    ports:
      - "5001:5001"
    volumes:
      # Maps local backend code so Python changes reflect instantly
      - ./backend:/backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # Automatically migrate db, create admin, and start the server
    command: >
      bash -c "
      flask db upgrade &&
      flask create-admin admin defaultPassword123 &&
      flask run --host=0.0.0.0 --port=5001 --debug
      "

  # --- THE AI TASK RUNNER (Background Worker) ---
  task-runner:
    build: ./backend
    working_dir: /backend
    volumes:
      # Map local code so worker changes reflect on restart
      - ./backend:/backend
    env_file:
      - .env
    command: ["python", "task_runner.py"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - with-task-runner   # Opt-in for dev testing as well

  # --- THE DATABASE ---
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - nexidion-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexidion-db-data: