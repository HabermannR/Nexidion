services:
  # --- THE FRONTEND (Vite with Hot-Reloading) ---
  frontend:
    build: ./frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      # Map your code so live-reloading works
      - ./frontend:/app
      # Prevents local empty node_modules from overwriting container
      - /app/node_modules
      # Maps the custom remark plugin
      - ./remark-internal-links:/remark-internal-links
    environment:
      # Tell React where the backend is so it can make API calls!
      - VITE_API_URL=http://localhost:5001
    depends_on:
      - backend

  # --- THE BACKEND (Flask API) ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    ports:
      - "5001:5001"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=development
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
      flask db upgrade &&
      flask create-admin admin defaultPassword123 &&
      flask create-llm-agent &&
      flask run --host=0.0.0.0 --port=5001 --debug
      "

  # --- THE BACKEND TEST RUNNER ---
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    working_dir: /project
    volumes:
      # Mount the whole project root so pytest sees /backend AND /tests
      - .:/project
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      # Tell Python that the root folder is the base module path
      - PYTHONPATH=/project
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - test
    command: >
      bash -c "
      PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'nexidion_test'\" | grep -q 1 || PGPASSWORD=$$DB_PASSWORD psql -h postgres -U $$DB_USER -d postgres -c \"CREATE DATABASE nexidion_test\";
      pytest
      "

  # --- THE AI TASK RUNNER (Background Worker) ---
  task-runner:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    command: [ "python", "task_runner.py" ]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    profiles:
      - with-task-runner   # opt-in: only starts when explicitly requested

  # --- THE DATABASE ---
  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - nexidion-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nexidion-db-data: