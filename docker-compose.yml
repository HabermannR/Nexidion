services:
  nexidion:
    image: rhabermann/nexidion:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - APP_ENV=production
      - ASSET_STORAGE_FOLDER=/app/asset_storage
      - LOCAL_LLM_URL=${DOCKER_LOCAL_LLM_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - nexidion-asset-data:/app/asset_storage
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # Won't fail if postgres profile is skipped
    command: >
      bash -c "
      flask db upgrade &&
      flask create-admin admin ${ADMIN_PASSWORD}  &&
      flask create-llm-agent &&
      python -m gunicorn --bind 0.0.0.0:5001 wsgi:app
      "

  task-runner:
    image: rhabermann/nexidion:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - APP_ENV=production
      - LOCAL_LLM_URL=${DOCKER_LOCAL_LLM_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "task_runner.py"]
    working_dir: /app
    volumes:
      - ./audit_logs:/app/audit_logs
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    profiles:
      - with-task-runner   # opt-in: only starts when explicitly requested

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - nexidion-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - with-postgres   # opt-in, but used in the default start script

volumes:
  nexidion-db-data:
  nexidion-asset-data:
