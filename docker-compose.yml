services:
  nexidion:
    image: rhabermann/nexidion:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - APP_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
        required: false   # Won't fail if postgres profile is skipped

  task-runner:
    image: rhabermann/nexidion:latest
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - APP_ENV=production
    command: ["python", "task_runner.py"]
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    profiles:
      - with-task-runner   # opt-in: only starts when explicitly requested

  postgres:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - nexidion-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - with-postgres   # opt-in, but used in the default start script

volumes:
  nexidion-db-data: