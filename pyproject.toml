# ==========================================================
#               Build System Configuration
# ==========================================================
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# ==========================================================
#                 Project Core Metadata
# This section defines your package and its core dependencies.
# These are the packages needed for your app to RUN.
# ==========================================================
[project]
name = "nexidion-backend"
version = "4.1.1"
requires-python = ">=3.10"
description = "The backend service for the Nexidion project."
dependencies = [
    # Web Framework & Extensions
    "Flask",
    "flask-cors",
    "Flask-JWT-Extended",
    "Flask-Migrate",         # This automatically includes 'alembic'
    "Flask-SQLAlchemy",
    "gunicorn",
    # Database driver (Required for the agent)
    "psycopg2-binary",
    # AI Interfaces
    "openai",
    # Utilities
    "python-dotenv",
    "Pillow",
    "apscheduler>=3.11.2",
    "flask-limiter>=3.8.0",
    "pymupdf>=1.24.11",
    "pymupdf4llm==1.27.2.3",
]

# ==========================================================
#               Optional Dependencies
# These are packages for development, testing, etc. They are
# not installed by default in production.
# ==========================================================
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",         # Includes 'coverage' and integrates it with pytest
    "pytest-mock",
]
dev = [
    "line-profiler",
    "sqlite-utils",
    "tabulate",
]


# ==========================================================
#                  Build Configuration
# This tells setuptools what code to include in the package.
# ==========================================================
[tool.setuptools]
packages = ["backend", "agent"]


# ==========================================================
#               Tool-Specific Configuration
# ==========================================================
[tool.pytest.ini_options]
# These options are now applied to EVERY pytest run automatically.
# The --cov flags are handled here. Added --cov=agent
addopts = "--cov=backend --cov=agent  --cov-report=html --cov-report=term-missing"


[tool.coverage.run]
# Tells coverage to track BOTH directories
source = ["backend", "agent"]
omit = ["backend/scripts/*", "backend/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
